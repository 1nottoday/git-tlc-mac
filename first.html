<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First verstka</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<header>
</header>
<body>
    <div class="first">
        <div class="design">
            <img src="./bg.jpg" alt="blue design with a laptop" class="bg">
            <img src="./logo.svg" class="logo" alt="logo">
        </div>

        <h2>
            Get iintoo it today
        </h2>

        <h3>
            There is no charge or obligation upon registration
        </h3>
        <br><br>

        <button class="facebook" type="submit">Register with facebook
             <img src="./facebook.svg" alt="Register with facebook" width="20" height="20" class="button-facebook">
        </button>

        <button class="Linkedin" type="submit">Register with Linkedin
            <img src="./linkedin.svg" alt="Linkedin" width="20" height="20" class="button-Linkedin">
        </button>
        <br><br><br><br>
        <div class="divider">OR</div>
        <br><br>
    
        <form action="" method="get" class="form-example">
            <div class="form-example">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                placeholder="Enter your email" required>
                <label for="phone">Phone</label>
                <input type="phone" id="phone" name="phone"
                placeholder="Enter your phone" required>
            </div>

        <p>
           What type of investor are you?
        </p>
        <p>
           Select the type of investor you are below
        </p>
   

        <form action="" method="get" class="form-example">
            <div class="form-example">
                <input type="radio" id="Individual" name="options"
                value="Individual" checked>
                <label for="Individual">Individual</label>

                <input type="radio" id="Business" name="options"
                value="Business" checked>
                <label for="Business">Business</label>

                <input type="radio" id="IRA" name="options"
                value="IRA" checked>
                <label for="IRA">IRA</label>

                <input type="radio" id="Trust" name="options"
                value="Trust" checked>
                <label for="Trust">Trust</label>
            </div>

        <p>
           <button>Create Account</button>
        </p>
    </div>
</body>
</html>
